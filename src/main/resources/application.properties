spring.application.name=microservicios

# Puerto del servidor
server.port=8080

# Configuración H2 - Base de datos en memoria
spring.datasource.url=jdbc:h2:mem:cursosdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2 (para ver/editar datos en navegador)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA - Crear tablas automáticamente al iniciar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect